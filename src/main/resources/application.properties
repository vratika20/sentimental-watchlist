spring.application.name=sentinel-watchlist

# Render supplies PORT. Local development remains on 8080.
server.port=${PORT:8080}

# Render PostgreSQL credentials. H2 remains the zero-configuration local default.
spring.datasource.url=${DB_URL:jdbc:h2:mem:sentineldb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate detects H2 or PostgreSQL from the configured JDBC URL.
# `update` creates a fresh Render database schema and preserves existing deployed data.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Hibernate owns schema creation in every environment; DataLoader then seeds an empty database.
spring.sql.init.mode=never

# Retained for convenient local inspection; leave unset/false on Render.
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# Comma-separated origins are supported when needed (for example a Vercel deployment).
frontend.url=${FRONTEND_URL:http://localhost:5173}
